name: Atualizar dados do painel

on:
  schedule:
    - cron: "7 * * * *"   # a cada hora (minuto 7, UTC)
  workflow_dispatch:       # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Buscar dados no Windsor.ai
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python scripts/fetch_windsor.py

      # Funil comercial. Se o RD falhar, o painel segue com os dados do Meta
      # e mantém o último crm.json bom.
      - name: Buscar funil no RD Station CRM
        continue-on-error: true
        env:
          RD_CRM_TOKEN: ${{ secrets.RD_CRM_TOKEN }}
        run: python scripts/fetch_rd_crm.py

      - name: Commitar dados se mudaram
        run: |
          git config user.name "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add -A metrics.json crm.json assets/
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Atualiza dados (Windsor.ai + RD CRM)"
            git pull --rebase
            git push
          fi
