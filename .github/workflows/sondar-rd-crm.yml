name: Sondar RD CRM
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - env:
          RD_CRM_TOKEN: ${{ secrets.RD_CRM_TOKEN }}
        run: python scripts/probe_rd_crm.py
