name: Sondar RD CRM

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sondar
        env:
          RD_CRM_TOKEN: ${{ secrets.RD_CRM_TOKEN }}
        run: python scripts/probe_rd_crm.py
